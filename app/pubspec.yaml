name: rede_apoio
description: Aplicativo de acesso à rede de proteção e contatos de confiança.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^9.2.2 # pessoa de confiança criptografada no aparelho
  shared_preferences: ^2.3.2 # cache offline do conteúdo (canais e guias)
  flutter_map: ^8.1.1 # mapa OpenStreetMap (BSD-3, sem chave de API)
  latlong2: ^0.9.1 # coordenadas para o flutter_map
  flutter_animate: ^4.5.2 # animações declarativas (equivalente ao Framer Motion no Flutter)
  flutter_native_contact_picker: ^0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/offline/
    - assets/brand/

  # Fontes embutidas (licença OFL, ver assets/fonts/*-OFL.txt).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
